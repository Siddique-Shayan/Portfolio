    <!--
      Anti-flash theme script: applies the persisted theme class before React mounts
      or the first paint happens, so there's no light/dark flicker on load.
      Keep this in sync with src/store/themeStore.ts.
    -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('portfolio-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
